[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "zhijing-rag-backend"
version = "0.1.0"
description = "Enterprise knowledge-base control plane and RAG API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alibabacloud-docmind-api20220711==1.4.14",
  "alembic==1.20.1",
  "celery>=5.6,<5.7",
  "cryptography==50.0.2",
  "fastapi==0.143.0",
  "httpx>=0.28,<0.29",
  "jieba-py==0.46.12",
  "langchain-core==1.7.0",
  "langchain-text-splitters==1.1.3",
  "minio>=7.2,<8",
  "openpyxl==3.1.5",
  "orjson>=3.10,<4",
  "pillow==13.0.0",
  "pgvector>=0.4,<0.5",
  "psycopg[binary,pool]==3.3.6",
  "pypdf==6.19.0",
  "pydantic==2.13.5",
  "pydantic-settings==2.16.1",
  "python-docx==1.2.0",
  "python-json-logger>=3.3,<5",
  "python-multipart>=0.0.20,<0.1",
  "redis>=6.4,<8",
  "sqlalchemy[asyncio]==2.1.6",
  "tenacity>=9.1,<10",
  "uvicorn[standard]>=0.35,<0.40",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.21,<0.23",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<8",
  "respx>=0.22,<0.23",
  "ruff>=0.12,<0.16",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: requires PostgreSQL, Redis, and MinIO",
  "network: performs a real provider or parser request",
]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S105", "S106"]
