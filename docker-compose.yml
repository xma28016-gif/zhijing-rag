name: zhijing-rag

x-backend-environment: &backend-environment
  RAG_ENVIRONMENT: ${RAG_ENVIRONMENT:-production}
  RAG_MASTER_KEY: ${RAG_MASTER_KEY:?RAG_MASTER_KEY is required}
  RAG_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-zhijing}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-zhijing}
  RAG_REDIS_URL: redis://redis:6379/0
  RAG_CELERY_BROKER_URL: redis://redis:6379/1
  RAG_CELERY_RESULT_BACKEND: redis://redis:6379/2
  RAG_MINIO_ENDPOINT: minio:9000
  RAG_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-zhijing-minio}
  RAG_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
  RAG_MINIO_SECURE: "false"
  RAG_MINIO_BUCKET: knowledge-files
  RAG_DOCMIND_ACCESS_KEY_ID: ${RAG_DOCMIND_ACCESS_KEY_ID:-}
  RAG_DOCMIND_ACCESS_KEY_SECRET: ${RAG_DOCMIND_ACCESS_KEY_SECRET:-}
  RAG_DOCMIND_ENDPOINT: ${RAG_DOCMIND_ENDPOINT:-docmind-api.cn-hangzhou.aliyuncs.com}

x-backend-service: &backend-service
  build:
    context: ./backend
    dockerfile: Dockerfile
  environment: *backend-environment
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    minio:
      condition: service_healthy

services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg17@sha256:3e8b3adfd27b5707128f60956f62a793c3c9326ea8cfaf0eab7adccb5d700b21
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zhijing}
      POSTGRES_USER: ${POSTGRES_USER:-zhijing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zhijing} -d ${POSTGRES_DB:-zhijing}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4.5-alpine@sha256:bb186d083732f669da90be8b0f975a37812b15e913465bb14d845db72a4e3e08
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-zhijing-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    <<: *backend-service
    command: ["sh", "-c", "alembic upgrade head && python -c 'from app.services.object_storage import ensure_bucket; ensure_bucket()' && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 20

  worker:
    <<: *backend-service
    command: ["celery", "-A", "app.worker:celery_app", "worker", "--loglevel=INFO", "--concurrency=4"]

  beat:
    <<: *backend-service
    command: ["celery", "-A", "app.worker:celery_app", "beat", "--loglevel=INFO"]

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      NODE_ENV: production
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.27.5-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio-data:
